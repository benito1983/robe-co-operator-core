[project]
name = "robe-co-operate"
version = "0.1.0"
description = "RoBe Co-Operator - Multi-Tenant-Plattform mit modularer Architektur"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Core
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "cryptography==50.0.1",

    # Auth
    "PyJWT==2.13.0",
    "argon2-cffi==25.1.0",

    # AI
    "requests==2.34.2",
    "google-genai==2.20.0",
    "openai==3.6.0",

    # HTTP
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "python-multipart==0.0.32",

    # ML/Affiliate
    "joblib==1.5.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",

    # Knowledge/ClearSearch
    "networkx==3.6.1",
    "scipy==1.18.1",
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "sentence-transformers==6.0.1",
    "torch==2.13.0",

    # Studio
    "moviepy==1.0.3",
    "Pillow==12.3.0",
    "faster-whisper==1.2.1",

    # Other
    "psutil==7.2.2",
    "stripe==15.6.0",
    "RestrictedPython>=6.0",
    "psycopg[binary]>=3.1",
    "flask",
    "flet",
    "opencv-python-headless",
    "sqlalchemy>=2.0",
    "celery>=5.4",
    "redis>=5.0",
    "pydantic-settings>=2.6",
    "passlib[bcrypt]>=1.7",
    "pathspec>=0.12",
    "markdownify>=0.13",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "Handbuch",
    "ROADMAP.py",
    "docs",
    "infra",
    "__pycache__",
    ".git",
    "venv",
    ".venv",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    # ── Vorgegebene Ausnahmen ──────────────────────────────────────────────
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (ok in tests)
    "B008",   # function call in default argument (FastAPI Depends)

    # ── Stil / Simplify: kein Fehlverhalten, reine Lesbarkeitsfrage ────────
    "SIM117", # verschachtelte with-Statements zu einem verschmelzen
    "SIM102", # verschachtelte ifs zu einem verschmelzen
    "SIM105", # try/except/pass durch contextlib.suppress ersetzen
    "SIM115", # offene Datei mit globalem Schluessel statt Context Manager
    "B904",   # raise ... from innerhalb eines except-Blocks
    "E402",   # import nicht am Dateianfang (bewusst nach Config/Logging-Setup)
    "UP007",  # Legacy-Union-Syntax (py311 unterstuetzt beides)

    # ── Deutsche UI-/Kommentartexte: Ersetzen wuerde die Texte verfaelschen ─
    "RUF001", # ambigues Unicode (z.B. en-dash in deutschen Saetzen)
    "RUF002", # ambigues Unicode in Docstrings
    "RUF003", # ambigues Unicode in Kommentaren

    # ── False Positives, am 25.09.2026 einzeln verifiziert ─────────────────
    # S608: Es werden ausschliesslich hartkodierte SQL-Fragmente interpoliert
    #   (self.table als Klassenattribut, Ternary-Strings wie "deleted_at IS
    #   NULL", Pydantic-Feldnamen unter extra="forbid"). Alle Werte - auch
    #   User-Input - laufen durch %s-Parameter. Stellen: core/repository.py,
    #   circuitlab/orchestration_routes.py, medialibrary + crm + wissenszweig
    #   + sitebuilder + logocreator + codes + affiliate + parent_retriever.
    "S608",
    # S104: `ip = ip or "0.0.0.0"` ist der Fallback fuer Throttle-Keys in
    #   auth_service, keine Netzwerk-Bind-Adresse.
    "S104",
    # S105: Test-Fixtures (token/secret_key-Feldnamen) und die Konstante
    #   PASS in professor/quality.py - keine echten Zugangsdaten.
    "S105",
    # S310: urllib nur mit festem https:// aus der Konfiguration; file:
    #   und Custom-Schemes sind konstruktiv ausgeschlossen.
    "S310",
    # S603: subprocess mit fester Executable ("ffprobe"), ohne shell=True.
    "S603",
    # S607: PATH-abhaengiger Aufruf von ffprobe - kein Injection-Risiko.
    "S607",
    # S311/S306: pseudo-random bzw. mktemp ausschliesslich in Tests.
    "S311",
    "S306",

    # ── Exception-Handling: bewusst still, Fehler duerfen Requests nicht
    #   brechen (u.a. Chronos-Reporting und Traffic-Logging sind best effort)
    "S110",   # try/except/pass
    "S112",   # try/except/continue

    # ── Diverses ───────────────────────────────────────────────────────────
    "RUF012", # mutable class attribute ohne ClassVar-Annotierung
    "RUF006", # Referenz auf asyncio-Task nicht gehalten (fire and forget)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false  # psycopg2 returns Any everywhere - enable later
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "Handbuch",
    "ROADMAP.py",
    "docs",
    "infra",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short -q --ignore=tests/test_chronos_bridge.py --ignore=tests/test_regulation_bridge.py --ignore=tests/test_capability_matrix_attack.py --ignore=tests/test_clearsearch_module.py --ignore=tests/test_collaborate_module.py --ignore=tests/test_community_module.py --ignore=tests/test_content_manager_module.py --ignore=tests/test_design_module.py --ignore=tests/test_knowledge_module.py --ignore=tests/test_mail_module.py --ignore=tests/test_ml_module.py --ignore=tests/test_projects_module.py --ignore=tests/test_studio_module.py --ignore=tests/test_affiliate_routes.py --ignore=tests/test_codes_routes.py --ignore=tests/test_credits_race_attack.py --ignore=tests/test_credits_routes.py --ignore=tests/test_marketplace_routes.py --ignore=tests/test_medialibrary_routes.py --ignore=tests/test_media_hotspots_routes.py"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0  # Start with 0, increase gradually
